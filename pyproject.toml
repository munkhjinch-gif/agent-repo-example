[project]
name = "s-kpisem-agent"
version = "0.1.0"
description = "S-KPISEM: KPI semantic layer audit agent (Hefesto SCRIPT mode). Example CSPD agent repo."
requires-python = ">=3.11"
dependencies = []  # runtime: standard library only (Hefesto runner)

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
